<svg xmlns="http://www.w3.org/2000/svg" width="840" height="150" viewBox="0 0 840 150" role="img" aria-label="SOC Quest: 학원 파이썬 노트북 36문제를 브라우저에서 바로 풀어 보는 학습 게임"><style>
text{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;fill:#f0f6fc}
.m{fill:#9198a1} .a{fill:#34d399} .mono{font-family:'JetBrains Mono',Consolas,monospace}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
@keyframes fill{from{transform:scaleX(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blip{0%,100%{opacity:.2}40%{opacity:1}}
.r{animation:rise .8s cubic-bezier(.16,1,.3,1) backwards}
.xp{transform-box:fill-box;transform-origin:left;animation:fill 1.6s cubic-bezier(.16,1,.3,1) .4s backwards}
.sweep{transform-origin:700px 120px;animation:spin 4s linear infinite}
.b1{animation:blip 4s linear infinite} .b2{animation:blip 4s linear 2.2s infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect x=".5" y=".5" width="839" height="149" rx="12" fill="#161b22" stroke="#30363d"/>
<text x="28" y="40" font-size="12" class="m">메인 퀘스트</text>
<text x="28" y="72" font-size="22" font-weight="700">SOC Quest</text>
<text x="28" y="100" font-size="14" class="m">학원 파이썬 노트북 36문제를 브라우저에서 바로 풀어 보는 학습 게임</text>
<text x="28" y="126" font-size="12" class="a mono">Python  JavaScript</text>
<rect x="676" y="54" width="136" height="42" rx="21" fill="#34d399"/>
<text x="744" y="80" text-anchor="middle" font-size="15" font-weight="700" style="fill:#04241a">플레이하기</text></svg>